name: Compilar Vaga Pronta - Acessibilidade
on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-vagapronta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar assinatura e APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Baixar APK da compilacao
        uses: actions/upload-artifact@v4
        with:
          name: VagaPronta-Acessibilidade-03-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
